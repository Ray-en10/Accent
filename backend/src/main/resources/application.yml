spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55432/tricity}
    username: ${SPRING_DATASOURCE_USERNAME:tricity}
    password: ${SPRING_DATASOURCE_PASSWORD:tricity}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
spring.web.cors:
  allowed-origins: http://localhost:4200
app:
  public-url: ${APP_PUBLIC_URL:http://127.0.0.1:4200}
